; PlatformIO Project Configuration
; DIY Comfort Control Module - ESP32-S3 controller firmware

[platformio]
default_envs = esp32s3_devkit_release

[common]
monitor_speed = 115200
lib_ldf_mode = deep+
extra_scripts = extra_script.py
lib_deps =
    lvgl/lvgl@8.3.11
    moononournation/GFX Library for Arduino@1.5.9
    fastled/FastLED@3.10.3
    mikalhart/TinyGPSPlus@1.0.3
    autowp/autowp-mcp2515@1.3.1
    adafruit/Adafruit NeoPixel@1.12.3
    bblanchon/ArduinoJson@7.1.0
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FASTLED_INTERNAL
    -D CCM_CAN_BITRATE=500000
    -D CCM_CAN_PROTOCOL_VERSION=1
    -D CCM_CAN_TRANSPORT_SPI=1
    -D CCM_CAN_TRANSPORT_TWAI=0
    -D CCM_CAN_MCP_CLOCK_MHZ=8
    -D CCM_CAN_ONLY_DEBUG=0
    -D CCM_SCREEN_SERIAL_LOGS=0
    -D CCM_GPS_SERIAL_LOGS=0
    -D CCM_HEAP_SERIAL_LOGS=0
    -D CCM_LOCAL_KNOCK_ENABLED=0
    -D CCM_MAIN_LED_COUNT=18
    -D CCM_CASE_LED_COUNT=7
    -D CCM_INTERIOR_LED_SEND_COUNT=180
    -D CCM_CASE_LED_OFFSET=0
    -D CCM_CAN_SPI_HZ=1000000UL
    -D CCM_CAN_TASK_PERIOD_MS=2
    -D CCM_CAN_TASK_STACK_BYTES=7168
    -D CCM_CAN_RX_INT_GATED=0
    -D CCM_CAN_RX_FALLBACK_POLL_MS=50
    -D CCM_CAN_RX_MAX_FRAMES_PER_TICK=32
    -D CCM_CAN_HEARTBEAT_TX_MS=250
    -D CCM_CAN_TACH_TX_MS=50
    -D CCM_CAN_GPS_TX_MS=500
    -D CCM_CAN_ENGINE_RUNTIME_TX_MS=50
    -D CCM_CAN_METH_CONFIG_TX_MS=1000
    -D CCM_GPS_ZERO_CLAMP_MPH=5.0f
    -D CCM_GPS_ZERO_HOLD_MS=600
    -D CCM_GPS_LOW_SPEED_SMOOTH_ALPHA=0.16f
    -D CCM_GPS_HIGH_SPEED_SMOOTH_ALPHA=0.38f
    -D CCM_GPS_MAX_ACCEL_MPS2=8.0f
    -D CCM_GPS_SPIKE_GRACE_MPH=6.0f
