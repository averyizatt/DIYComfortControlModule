[platformio]
default_envs = esp32s3_devkit_release

[env]
; PioArduino currently publishes stable releases as GitHub-hosted platform zips.
; If this URL ever stops resolving, pin the replacement stable release or mirror
; the same release zip internally before changing the default ESP32-S3 toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  lvgl/lvgl@8.3.11
  moononournation/GFX Library for Arduino@1.5.9
  mikalhart/TinyGPSPlus@1.0.3
  autowp/autowp-mcp2515@1.3.1
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.1.0
  mathieucarbou/AsyncTCP@3.3.2
  mathieucarbou/ESPAsyncWebServer@3.6.0
extra_scripts = extra_script.py
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CCM_CAN_BITRATE=500000
  -D CCM_CAN_PROTOCOL_VERSION=1
  -D CCM_CAN_TRANSPORT_SPI=1
  -D CCM_CAN_TRANSPORT_TWAI=0
  -D DEMO_MODE=0
  -D CCM_WEB_ENABLED=0

[env:esp32s3_devkit_debug]
board = esp32-s3-devkitc-1
build_type = debug
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=1

[env:esp32s3_devkit_release_base]
board = esp32-s3-devkitc-1
build_type = release
upload_port = COM10
upload_speed = 115200
upload_flags =
  --no-stub
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=0

[env:esp32s3_devkit_release]
extends = env:esp32s3_devkit_release_base

[env:esp32s3_devkit_release_pioarduino]
; Backward-compatible alias for existing scripts/tooling that used the earlier
; PioArduino comparison environment name before it became the default release.
; Remove this alias after downstream scripts have migrated to
; esp32s3_devkit_release or esp32s3_devkit_release_stock, targeting removal
; after 2026-12-31 during the next build-configuration cleanup.
extends = env:esp32s3_devkit_release

[env:esp32s3_devkit_release_stock]
platform = espressif32@6.7.0
extends = env:esp32s3_devkit_release_base

[env:esp32s3_devkit_demo]
board = esp32-s3-devkitc-1
build_type = release
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=0
  -D DEMO_MODE=1

[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
  -DUNIT_TEST
  -DDEMO_MODE=1
