[env:esp32s3_devkit_release]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.embed_files =
    src/ui/assets/templates/ui_template_dash.bin
    src/ui/assets/templates/ui_template_meth.bin
    src/ui/assets/templates/ui_template_tail.bin
    src/ui/assets/templates/ui_template_temps.bin
    src/ui/assets/templates/ui_template_diag.bin
    src/ui/assets/templates/ui_template_knock.bin
build_type = release
monitor_speed = ${common.monitor_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D DEMO_MODE=0
    -D CCM_BUILD_DEBUG=0
    -O2
    -D CORE_DEBUG_LEVEL=0

[env:esp32s3_devkit_debug]
extends = env:esp32s3_devkit_release
build_type = debug
build_flags =
    ${common.build_flags}
    -D DEMO_MODE=0
    -D CCM_BUILD_DEBUG=1
    -Og
    -g3
    -D CORE_DEBUG_LEVEL=3

; Minimal bench image: starts only shared SPI and the MCP2515 CAN task.
; Serial output includes rate-limited frame traces and one-second controller
; health snapshots so CAN faults remain readable at 115200 baud.
[env:esp32s3_can_debug]
extends = env:esp32s3_devkit_release
build_unflags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CCM_CAN_ONLY_DEBUG=0
build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CCM_CAN_ONLY_DEBUG=1
    -D CCM_CAN_FRAME_TRACE=1
    ; Original/documented working harness pinout. The production pin map was
    ; later changed to 8/3/17 + CS11, which reads 0xFF on the installed MCP2515.
    -D CCM_PIN_SPI_SCK=12
    -D CCM_PIN_SPI_MOSI=11
    -D CCM_PIN_SPI_MISO=13
    -D CCM_PIN_CAN_SPI_CS=17
    -D CCM_PIN_CAN_SPI_INT=18
    -D CCM_PIN_CAN_SPI_RST=21
    -D DEMO_MODE=0
    -D CCM_BUILD_DEBUG=1
    -O2
    -D CORE_DEBUG_LEVEL=0

[env:esp32s3_devkit_demo]
extends = env:esp32s3_devkit_release
build_flags =
    ${common.build_flags}
    -D DEMO_MODE=1
    -D CCM_BUILD_DEBUG=0
    -O2
    -D CORE_DEBUG_LEVEL=0

[env:esp32s3_devkit_release_pioarduino]
extends = env:esp32s3_devkit_release

[env:esp32s3_devkit_release_stock]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = ${common.monitor_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
extra_scripts = ${common.extra_scripts}
lib_deps =
    ${common.lib_deps}
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
build_flags =
    ${common.build_flags}
    -D DEMO_MODE=0
    -D CCM_BUILD_DEBUG=0
    -D LV_CONF_INCLUDE_SIMPLE
    -D CORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_build_src = yes
build_flags =
    -D CCM_CAN_BITRATE=500000
    -D CCM_CAN_PROTOCOL_VERSION=1
    -I include
    -I src
    -I shared/can_contract/include
    -I test/mocks
