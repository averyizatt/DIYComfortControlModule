    -D CCM_DISPLAY_DIAG_FLUSH_SAMPLE=64
    -D CCM_DISPLAY_LCD_ONLY_TEST=0
    -D CCM_DISPLAY_PAGE_STRESS_TEST=0
    -D CCM_DISPLAY_PAGE_STRESS_MS=1500
    -D CCM_SPI_DIAG_VERBOSE=0
    -D CCM_SPI_DIAG_SAMPLE=32
    -D CCM_SPI_LCD_RELEASE_GUARD_US=600
    -D CCM_SPI_RELEASE_GUARD_US=120
