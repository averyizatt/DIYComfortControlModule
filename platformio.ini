[platformio]
default_envs = esp32s3_devkit_release

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  lvgl/lvgl@8.3.11
  moononournation/GFX Library for Arduino@1.5.9
  mikalhart/TinyGPSPlus@1.0.3
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.1.0
  mathieucarbou/AsyncTCP@3.3.2
  mathieucarbou/ESPAsyncWebServer@3.6.0
extra_scripts = extra_script.py
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CCM_CAN_BITRATE=500000
  -D CCM_CAN_PROTOCOL_VERSION=1
  -D DEMO_MODE=0

[env:esp32s3_devkit_debug]
board = esp32-s3-devkitc-1
build_type = debug
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=1

[env:esp32s3_devkit_release]
board = esp32-s3-devkitc-1
build_type = release
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=0

[env:esp32s3_devkit_demo]
board = esp32-s3-devkitc-1
build_type = release
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=0
  -D DEMO_MODE=1
