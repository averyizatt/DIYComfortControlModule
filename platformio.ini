[platformio]
default_envs = esp32s3_devkit_release

[env]
; PioArduino currently publishes stable releases as GitHub-hosted platform zips.
; If this URL ever stops resolving, pin the replacement stable release or mirror
; the same release zip internally before changing the default ESP32-S3 toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_port = COM5
lib_ldf_mode = deep+
lib_deps =
  lvgl/lvgl@8.3.11
  moononournation/GFX Library for Arduino@1.5.9
  lovyan03/LovyanGFX@1.2.21
  mikalhart/TinyGPSPlus@1.0.3
  autowp/autowp-mcp2515@1.3.1
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.1.0
  mathieucarbou/AsyncTCP@3.3.2
  mathieucarbou/ESPAsyncWebServer@3.6.0
extra_scripts = extra_script.py
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CCM_CAN_BITRATE=500000
  -D CCM_CAN_PROTOCOL_VERSION=1
  -D CCM_CAN_TRANSPORT_SPI=1
  -D CCM_CAN_TRANSPORT_TWAI=0
  -D CCM_MAIN_LED_COUNT=18
  -D CCM_CASE_LED_COUNT=7
  -D CCM_INTERIOR_LED_SEND_COUNT=60
  -D CCM_CASE_LED_OFFSET=0
  -D DEMO_MODE=0
  -D CCM_WEB_ENABLED=0

[env:esp32s3_devkit_debug]
board = esp32-s3-devkitc-1
build_type = debug
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=1

[env:esp32s3_devkit_release_base]
board = esp32-s3-devkitc-1
build_type = release
upload_port = COM5
upload_speed = 115200
upload_flags =
  --no-stub
build_src_filter =
  +<*>
  -<web/>
  -<web/*>
  -<web/**>
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=0
  -O2
  -D CORE_DEBUG_LEVEL=0
  -D CCM_CAN_SPI_HZ=1000000UL
  -D CCM_CAN_TASK_PERIOD_MS=10
  -D CCM_CAN_RX_INT_GATED=1
  -D CCM_CAN_RX_FALLBACK_POLL_MS=50
  -D CCM_CAN_RX_MAX_FRAMES_PER_TICK=4
  -D CCM_CAN_HEARTBEAT_TX_MS=250
  -D CCM_CAN_TACH_TX_MS=50
  -D CCM_CAN_GPS_TX_MS=500
  -D CCM_CAN_SENSOR_EXT_TX_MS=500
  -D CCM_CAN_METH_CONFIG_TX_MS=1000
  -D CCM_GPS_ZERO_CLAMP_MPH=5.0f
  -D CCM_GPS_ZERO_HOLD_MS=600
  -D CCM_GPS_LOW_SPEED_SMOOTH_ALPHA=0.16f
  -D CCM_GPS_HIGH_SPEED_SMOOTH_ALPHA=0.38f
  -D CCM_GPS_MAX_ACCEL_MPS2=8.0f
  -D CCM_GPS_SPIKE_GRACE_MPH=6.0f
  -D CCM_GPS_DEAD_RECKON_MS=2500
  -D CCM_GPS_DEAD_RECKON_DECAY_MPH_PER_S=7.0f
  -D CCM_GPS_IMU_DEAD_RECKON=1
  -D CCM_GPS_IMU_ACCEL_CONFIRM=1
  -D CCM_GPS_IMU_ACCEL_MARGIN_MPS2=2.5f
  -D CCM_GPS_IMU_ACCEL_DEADBAND_MPS2=0.6f
  -D CCM_IMU_ENABLED=1
  -D CCM_DISPLAY_BACKEND_ARDUINO_GFX=1
  -D CCM_DISPLAY_BACKEND_LOVYAN_GFX=2
  -D CCM_DISPLAY_BACKEND=CCM_DISPLAY_BACKEND_ARDUINO_GFX
  -D CCM_DISPLAY_SPI_HZ=10000000UL
  -D CCM_DISPLAY_PIXEL_MODE=18
  -D CCM_DISPLAY_USE_GFX_DMA=0
  -D CCM_DISPLAY_USE_LGFX_DMA=0
  -D CCM_LVGL_DRAW_BUFFER_ROWS=12
  -D CCM_LVGL_FLUSH_CHUNK_ROWS=4
  -D CCM_LVGL_REFRESH_PERIOD_MS=16
  -D CCM_LGFX_FLUSH_CHUNK_ROWS=4
  -D CCM_SCREEN_TASK_PERIOD_MS=16
  -D CCM_UI_HEADER_UPDATE_MS=250
  -D CCM_UI_DASH_UPDATE_MS=50
  -D CCM_UI_LIVE_UPDATE_MS=100
  -D CCM_UI_HEAVY_UPDATE_MS=200
  -D CCM_UI_SCREEN_STATS_MS=5000
  -D CCM_DISPLAY_DIAG_BOOT=0
  -D CCM_SD_ENABLED=1
  -D CCM_SD_AUTOMOUNT=1
  -D CCM_SD_MAX_SPI_HZ=1000000UL
  -D CCM_SD_CREATE_FOLDERS_ON_BOOT=0
  -D CCM_SD_LOGGING_ENABLED=1
  -D CCM_SD_LOG_SNAPSHOT_PERIOD_MS=30000
  -D CCM_SD_LOG_DRAIN_INTERVAL_MS=5000
  -D CCM_SD_LOG_DRAIN_MAX_WRITES=1
  -D CCM_SD_STATUS_PERIOD_MS=60000
  -D CCM_SD_BROWSER_AUTO_REFRESH_MS=0
  -D CCM_STORAGE_TASK_PERIOD_MS=100
  -D CCM_GFX_DISABLE_FAST_PINIO=1
  -D CCM_DISPLAY_COMMAND_SETTLE_US=3
  -D CCM_DISPLAY_STRIPE_GAP_US=5
  -D CCM_ILI9488_INVCTR=0x00
  -D CCM_LVGL_FULL_REFRESH=0
  -D CCM_LVGL_FULL_WIDTH_DIRTY_BANDS=1
  -D CCM_LVGL_DIRTY_BAND_ROWS=4
  -D CCM_DISPLAY_FULL_REPAINT_ON_PAGE_SWITCH=1
  -D CCM_DISPLAY_18BIT_CHUNK_TRANSACTION=1
  -D CCM_DISPLAY_18BIT_HOLD_CS_PER_FLUSH=1
  -D CCM_DISPLAY_CRITICAL_SPI_BURSTS=1
  -D CCM_DISPLAY_DIAG_VERBOSE=0
  -D CCM_DISPLAY_DIAG_FLUSH_SAMPLE=64
  -D CCM_DISPLAY_LCD_ONLY_TEST=0
  -D CCM_DISPLAY_PAGE_STRESS_TEST=0
  -D CCM_DISPLAY_PAGE_STRESS_MS=1500
  -D CCM_SPI_DIAG_VERBOSE=0
  -D CCM_SPI_DIAG_SAMPLE=32
  -D CCM_SPI_LCD_RELEASE_GUARD_US=600
  -D CCM_SPI_RELEASE_GUARD_US=120
  -D CCM_SPI_LCD_ACQUIRE_GUARD_US=300
  -D CCM_SPI_NONLCD_AFTER_LCD_GUARD_US=600
  -D CCM_LED_ENABLED=1
  -D CCM_LED_SHOW_SHARED_LOCK=0
  -D CCM_LED_FRAME_INTERVAL_MS=16
  -D CCM_LED_TASK_PERIOD_MS=16
  -D CCM_LED_PIXEL_TYPE_CH1=(NEO_GRB+NEO_KHZ800)
  -D CCM_LED_PIXEL_TYPE_CH2=(NEO_GRB+NEO_KHZ800)
  -D CCM_LED_PIXEL_TYPE_CH3=(NEO_GRB+NEO_KHZ800)
  -D CCM_LED_CH1_HAS_WHITE=0
  -D CCM_LED_CH2_HAS_WHITE=0
  -D CCM_LED_CH3_HAS_WHITE=0
lib_ignore =
  LovyanGFX
  AsyncTCP
  ESPAsyncWebServer
  WiFi

[env:esp32s3_devkit_release]
extends = env:esp32s3_devkit_release_base

[env:esp32s3_devkit_lcd_only]
extends = env:esp32s3_devkit_release_base
build_flags =
  ${env:esp32s3_devkit_release_base.build_flags}
  -D CCM_DISPLAY_LCD_ONLY_TEST=1
  -D CCM_DISPLAY_PAGE_STRESS_TEST=1
  -D CCM_SPI_DIAG_VERBOSE=1
  -D CCM_SPI_DIAG_SAMPLE=16

[env:esp32s3_devkit_arduino18_stress]
extends = env:esp32s3_devkit_release_base
build_flags =
  ${env:esp32s3_devkit_release_base.build_flags}
  -D CCM_DISPLAY_PAGE_STRESS_TEST=1
  -D CCM_SPI_DIAG_VERBOSE=1
  -D CCM_SPI_DIAG_SAMPLE=16

[env:esp32s3_devkit_no_led]
extends = env:esp32s3_devkit_release_base
build_flags =
  ${env:esp32s3_devkit_release_base.build_flags}
  -D CCM_LED_ENABLED=0

[env:esp32s3_devkit_no_sd]
extends = env:esp32s3_devkit_release_base
build_unflags =
  -D CCM_SD_ENABLED=1
  -D CCM_SD_AUTOMOUNT=1
  -D CCM_SD_LOGGING_ENABLED=0
build_flags =
  ${env:esp32s3_devkit_release_base.build_flags}
  -D CCM_SD_ENABLED=0
  -D CCM_SD_AUTOMOUNT=0
  -D CCM_SD_LOGGING_ENABLED=0

[env:esp32s3_devkit_sd_logging]
extends = env:esp32s3_devkit_release_base
build_unflags =
  -D CCM_SD_LOGGING_ENABLED=0
  -D CCM_SD_CREATE_FOLDERS_ON_BOOT=0
build_flags =
  ${env:esp32s3_devkit_release_base.build_flags}
  -D CCM_SD_LOGGING_ENABLED=1
  -D CCM_SD_CREATE_FOLDERS_ON_BOOT=1

[env:esp32s3_devkit_lovyan16_stress]
extends = env:esp32s3_devkit_release_base
build_flags =
  ${env:esp32s3_devkit_release_base.build_flags}
  -D CCM_DISPLAY_BACKEND=CCM_DISPLAY_BACKEND_LOVYAN_GFX
  -D CCM_DISPLAY_PIXEL_MODE=16
  -D CCM_DISPLAY_USE_LGFX_DMA=0
  -D CCM_DISPLAY_PAGE_STRESS_TEST=1
  -D CCM_SPI_DIAG_VERBOSE=1
  -D CCM_SPI_DIAG_SAMPLE=16
lib_ignore =
  AsyncTCP
  ESPAsyncWebServer
  WiFi

[env:esp32s3_devkit_release_pioarduino]
; Backward-compatible alias for existing scripts/tooling that used the earlier
; PioArduino comparison environment name before it became the default release.
; Remove this alias after downstream scripts have migrated to
; esp32s3_devkit_release or esp32s3_devkit_release_stock, targeting removal
; after 2026-12-31 during the next build-configuration cleanup.
extends = env:esp32s3_devkit_release

[env:esp32s3_devkit_release_stock]
platform = espressif32@6.7.0
extends = env:esp32s3_devkit_release_base

[env:esp32s3_devkit_demo]
board = esp32-s3-devkitc-1
build_type = release
build_flags =
  ${env.build_flags}
  -D CCM_BUILD_DEBUG=0
  -D DEMO_MODE=1

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = false
lib_deps =
extra_scripts =
build_flags =
  -DUNIT_TEST
  -DDEMO_MODE=1
